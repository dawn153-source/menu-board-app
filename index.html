<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: 가로로 돌렸을 때 노치(화면 파인 부분)까지 배경이 꽉 차게 해요 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브릿지 커피 메뉴판</title>
<style>
  /* ===== 꾸미기 설정 ===== */
  /* 색을 바꾸고 싶으면 아래 색 코드(#으로 시작하는 글자)를 고치세요 */
  :root {
    --짙은갈색: #4A3728;  /* 배경·제목 색 */
    --크림색: #F5EFE6;    /* 카드·본문 색 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* 가로로 돌렸을 때 휴대폰이 글자를 멋대로 키우지 않게 해요 */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    word-break: keep-all;        /* 한글 단어가 중간에 끊기지 않게 해요 */
    overflow-wrap: anywhere;     /* 아주 긴 글자는 화면 밖으로 넘치지 않고 줄바꿈돼요 */
    font-family: "Gowun Dodum", "고운 돋움", "Malgun Gothic", "맑은 고딕", sans-serif;
    color: var(--크림색);
    min-height: 100vh;
    min-height: 100dvh;          /* 주소창이 접히고 펴져도 화면 높이가 맞게 해요 */
    background: var(--짙은갈색);
    display: flex;
    justify-content: center;
  }

  /* 안쪽 여백: 가로로 돌렸을 때 노치·둥근 모서리에 글자가 가려지지 않게 해요 */
  .화면 {
    width: 100%;
    max-width: 390px;
    padding: 36px max(18px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }

  /* 맨 위: 가게 이름과 소개 */
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 32px; letter-spacing: 2px; color: var(--크림색); }
  header .소개 { margin-top: 10px; font-size: 16px; opacity: 0.9; }
  header .위치 { margin-top: 6px; font-size: 14px; opacity: 0.75; }

  /* 유리 느낌 공통 스타일 (반투명 + 부드러운 그림자 + 둥근 모서리) */
  .유리 {
    background: rgba(245, 239, 230, 0.92);
    color: var(--짙은갈색);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    border-radius: 20px;
  }

  /* 가운데: 메뉴 카드 */
  .메뉴카드 {
    padding: 18px 20px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .메뉴카드 > div:first-child { min-width: 0; }  /* 이름이 길어도 가격을 밀어내지 않게 해요 */
  .메뉴카드 .이름 { font-size: 18px; font-weight: bold; }
  .메뉴카드 .설명 { font-size: 14px; opacity: 0.75; margin-top: 5px; }
  .메뉴카드 .가격 { font-size: 17px; font-weight: bold; white-space: nowrap; }
  .대표표시 {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: normal;
    color: var(--크림색);
    background: var(--짙은갈색);
    border-radius: 10px;
    vertical-align: middle;
  }

  /* 맨 아래: 영업시간, 안내, 전화 버튼 */
  footer { padding: 20px; margin-top: 26px; text-align: center; line-height: 1.8; font-size: 14px; }
  footer h2 { font-size: 16px; margin-bottom: 6px; }
  footer .안내 { margin-top: 12px; opacity: 0.8; }
  .전화버튼 {
    display: flex;               /* 버튼 글자를 가운데에 맞춰요 */
    align-items: center;
    justify-content: center;
    min-height: 52px;            /* 손가락으로 누르기 편한 크기(최소 48px 이상)예요 */
    margin-top: 18px;
    padding: 14px 0;
    font-size: 17px;
    font-weight: bold;
    text-decoration: none;
    color: var(--크림색);
    background: var(--짙은갈색);
    border-radius: 16px;
    box-shadow: 0 6px 16px rgba(74, 55, 40, 0.35);
    -webkit-tap-highlight-color: transparent;
  }
  /* 누르는 순간 살짝 작아져서 눌렸다는 걸 알 수 있어요 */
  .전화버튼:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="화면">

  <header>
    <!-- 가게 이름, 한 줄 소개, 위치는 여기서 고치세요 -->
    <h1>브릿지 커피</h1>
    <p class="소개">매일 직접 볶는 스페셜티 커피</p>
    <p class="위치">광주 북구 비엔날레</p>
  </header>

  <!-- 메뉴 카드는 아래 자바스크립트의 '메뉴' 목록에서 자동으로 만들어져요 -->
  <main id="메뉴목록"></main>

  <footer class="유리">
    <!-- 영업시간, 안내 문구, 전화번호는 여기서 고치세요 -->
    <h2>영업시간</h2>
    평일 08:00 ~ 21:00<br>
    주말 10:00 ~ 20:00<br>
    목요일 휴무
    <p class="안내">
      주차 2대 가능 · 1인 좌석 6석<br>
      인스타 @bridge_coffee
    </p>
    <!-- 전화번호를 바꾸려면 아래 'tel:' 뒤의 숫자를 고치세요 (하이픈 없이 써도 돼요) -->
    <a class="전화버튼" href="tel:062-000-0000">📞 전화 걸기</a>
  </footer>

</div>

<script>
  /* ===== 메뉴 고치는 곳 ===== */
  /* 아래 목록에서 이름, 가격, 설명을 마음대로 고치세요.
     - 메뉴를 늘리려면 { ... }, 한 줄을 복사해서 붙이세요.
     - 가격은 숫자만 쓰세요 (예: 4500). 쉼표는 자동으로 붙어요.
     - 대표 메뉴에는 대표: true, 를 쓰면 '대표' 표시가 붙어요. 필요 없으면 줄을 지우세요.
     - 따옴표(")와 줄 끝의 쉼표(,)는 지우지 마세요. */
  const 메뉴 = [
    { 이름: "아인슈페너", 가격: 5800, 설명: "단맛을 줄인 수제 크림", 대표: true },
    { 이름: "흑임자 라떼", 가격: 5500, 설명: "국산 흑임자를 직접 갈아 넣음", 대표: true },
    { 이름: "치즈케이크", 가격: 6500, 설명: "굽지 않은 부드러운 식감" },
  ];

  /* ===== 여기부터는 화면을 그리는 부분이에요. 몰라도 괜찮아요! ===== */
  const 목록 = document.getElementById("메뉴목록");

  메뉴.forEach(function (항목) {
    const 카드 = document.createElement("div");
    카드.className = "메뉴카드 유리";
    카드.innerHTML =
      '<div><div class="이름"><span class="글자"></span></div><div class="설명"></div></div>' +
      '<div class="가격"></div>';
    카드.querySelector(".글자").textContent = 항목.이름;
    if (항목.대표) {
      const 표시 = document.createElement("span");
      표시.className = "대표표시";
      표시.textContent = "대표";
      카드.querySelector(".이름").appendChild(표시);
    }
    카드.querySelector(".설명").textContent = 항목.설명;
    카드.querySelector(".가격").textContent = 항목.가격.toLocaleString("ko-KR") + "원";
    목록.appendChild(카드);
  });
</script>
</body>
</html>
